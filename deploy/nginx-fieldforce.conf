# Goes in /etc/nginx/sites-available/fieldforce (then symlink into
# sites-enabled). HTTP-only on purpose: `certbot --nginx` rewrites this
# block itself to add the 443 listener and the http->https redirect.
server {
    listen 80;
    server_name fieldforce.vorpet.com;

    client_max_body_size 10m;   # bill / check-in / employee photos

    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # route optimisation can take a moment
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
    }

    # Everything else is the web dashboard. /docs and /openapi.json are
    # deliberately NOT proxied, so the API explorer isn't public.
    location / {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
